name: GPS 30-Minute Auto Sync

on:
  schedule:
    # Runs every 30 minutes (Fixed boundary sync)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-gps:
    name: Sync WheelsEye and FleetX GPS
    runs-on: ubuntu-latest
    concurrency:
      group: sikka-gps-sync
      cancel-in-progress: false
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL || 'https://fleet.sikkaind.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger 30-Min GPS Telemetry Synchronization
        run: |
          set -euo pipefail
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set CRON_SECRET in the repository Actions secrets."
            exit 1
          fi
          echo "Triggering shared GPS sync endpoint."
          curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST "${BACKEND_URL%/}/api/gps-sync/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            --data '{}'
